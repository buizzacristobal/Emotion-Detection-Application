<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 650px;">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">Emotion Detection System</h3>
            </div>
            <div class="card-body">
                <p class="card-text text-muted">
                    Enter a statement below to analyze emotion scores for anger, disgust, fear, joy, and sadness.
                </p>
                <div class="form-group">
                    <label for="textToAnalyze" class="font-weight-bold">Text to analyze:</label>
                    <textarea class="form-control" id="textToAnalyze" rows="4" placeholder="Enter text here..."></textarea>
                </div>
                <button type="button" class="btn btn-primary btn-block" onclick="RunSentimentAnalysis()">
                    Run Emotion Analysis
                </button>
                <div class="mt-4">
                    <h5 class="font-weight-bold">System Response:</h5>
                    <div id="system_response" class="p-3 bg-white border rounded text-dark font-italic">
                        Results will appear here.
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
